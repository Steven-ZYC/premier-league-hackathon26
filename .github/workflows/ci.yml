name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          # A public dummy key verifies that build-time server env stays out of assets.
          DEEPSEEK_API_KEY: build-time-leak-sentinel-not-a-real-key
      - run: npm run package:appservice
      - run: npm run test:production
