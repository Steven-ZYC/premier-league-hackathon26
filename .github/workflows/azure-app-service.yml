name: Deploy Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-app-service-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  # App resource name, NOT the default hostname (which includes a random suffix).
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'pl-hackathon-web' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          # A public dummy key verifies that build-time server env stays out of assets.
          DEEPSEEK_API_KEY: build-time-leak-sentinel-not-a-real-key
      - run: npm run package:appservice
      - run: npm run test:production
      - name: Zip prebuilt production files
        working-directory: release
        run: zip -qr ../appservice.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: appservice-package
          path: appservice.zip
          retention-days: 3

  deploy:
    needs: build
    # Pushes to main auto-deploy after the one-time publish-profile secret setup.
    if: github.ref == 'refs/heads/main' && vars.AZURE_APP_SERVICE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appservice-package
      - name: Check publish profile is configured
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        shell: bash
        run: |
          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]; then
            echo "::error::Missing AZURE_WEBAPP_PUBLISH_PROFILE. Download the publish profile from the existing Azure Web App and paste its full XML into this GitHub Actions secret."
            exit 1
          fi
      - name: Deploy prebuilt app to existing Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: appservice.zip
